[General]
network = AutoEASORANNetwork
sim-time-limit = 24h
result-dir = results

AutoEASORANNetwork.bsinfoPath       = "BSinfo.csv"

# Outputs
AutoEASORANNetwork.cLoutPath        = "results/CLdata_sim.csv"
AutoEASORANNetwork.ecOutPath        = "results/ECdata_sim.csv"
AutoEASORANNetwork.actionInPath     = "results/action_in.csv"
AutoEASORANNetwork.cTemplatePath    = "templates/cl_out_template.csv"  # drives CL header

# Export cadence
AutoEASORANNetwork.exportPeriod     = 3600s
AutoEASORANNetwork.exportCount      = 24

# QoL
AutoEASORANNetwork.freezeWhenWaiting = true
AutoEASORANNetwork.useIdleTrap       = true