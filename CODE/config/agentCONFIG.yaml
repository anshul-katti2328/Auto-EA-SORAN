agent:
  id: "feedback_agent_001"
  heartbeat_interval: 30

communication:
  agent_id: "feedback_agent_001"

  # OptimizationAgent PUSH -> FeedbackAgent PULL
  reply_port: 5560

  # FeedbackAgent PUSH -> OptimizationAgent PULL
  optimization_response_host: "localhost"
  optimization_response_port: 5559

  # FeedbackAgent status publisher
  pub_port: 5561

  endpoints:
    optimization_agent:
      host: "localhost"
      port: 5565
      pub_port: 5564

validation:
  timeout: 300
  max_tx_power_dbm: 43.0
  min_tx_power_dbm: 18.0
  max_latency_ms: 5.0
  max_packet_loss_pct: 0.1
  min_throughput_mbps: 1.0
  min_throughput_retention: 0.95
  min_confidence: 0.70

monitoring:
  check_interval: 10
  post_change_window: 300

rollback:
  policies: []

policies:
  enforcement_levels:
    CRITICAL: 0.0
    HIGH: 0.1
    MEDIUM: 0.2
    LOW: 0.5