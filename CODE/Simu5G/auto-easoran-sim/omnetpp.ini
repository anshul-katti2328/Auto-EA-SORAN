[General]
network = autoeasoran.zmqonly.AutoEASORANNetwork
sim-time-limit = 60s
warmup-period = 1s

description = "30-gNB heterogeneous NR city with 90 UEs and compressed 24-hour traffic"

# Reproducibility
seed-set = ${repetition}

# Reduce OMNeT++ result-file overhead. KPIs will be collected
# through TwinMetricsAgent and ZMQ.
record-eventlog = false
**.routingRecorder.enabled = false
**.vector-recording = false
**.scalar-recording = false
**.sctp.**.vector-recording = false
**.sctp.**.scalar-recording = false

# ============================================================
# IPv4 and core-network configuration
# ============================================================
*.configurator.config = xmldoc("demo.xml")

# ============================================================
# Physical simulation area: 3 km x 3 km urban region
# ============================================================
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m

**.mobility.constraintAreaMaxX = 3000m
**.mobility.constraintAreaMaxY = 3000m
**.mobility.constraintAreaMaxZ = 0m

**.mobility.initFromDisplayString = false

# ============================================================
# Simu5G PHY configuration
# ============================================================
**.downlinkInterference = true
**.uplinkInterference = true

**.ueTxPower = 26dBm
**.eNodeBTxPower = 43dBm

**.targetBler = 0.01
**.blerShift = 5
**.fbPeriod = 40tti

# ============================================================
# NR carrier configuration
#
# 3.5 GHz, 20 MHz, 30 kHz subcarrier spacing.
# For 20 MHz at 30 kHz SCS, 51 NR resource blocks are used.
# ============================================================
*.carrierAggregation.numComponentCarriers = 1

*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 51

*.gnb[*].cellularNic.numCarriers = 1
*.gnb[*].cellularNic.phy.typename = "autoeasoran.zmqonly.ControllableGnbPhy"

*.gnb[*].cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"


*.ue[*].cellularNic.numCarriers = 1

*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"


# ============================================================
# Network size
# ============================================================
*.numGnbs = 30
*.numUesPerGnb = 3

# ============================================================
# Macro and small-cell configuration
#
# gNB 0..20  : 21 macro cells
# gNB 21..29 : 9 urban small cells
# ============================================================
*.gnb[0..20].cellInfo.microCell = false
*.gnb[21..29].cellInfo.microCell = true

*.gnb[0..20].cellularNic.phy.eNodeBTxPower = 43dBm
*.gnb[21..29].cellularNic.phy.eNodeBTxPower = 30dBm

# ============================================================
# Macro-gNB positions
#
# Twenty-one macros arranged on a 500 m urban grid.
# ============================================================
*.gnb[0..20].mobility.initialX = 400m + (ancestorIndex(1) % 5) * 500m
*.gnb[0..20].mobility.initialY = 400m + int(ancestorIndex(1) / 5) * 500m

# ============================================================
# Small-cell positions
#
# Nine hotspot cells arranged inside the macro-cell region.
# ============================================================
*.gnb[21..29].mobility.initialX = 650m + ((ancestorIndex(1) - 21) % 3) * 750m
*.gnb[21..29].mobility.initialY = 650m + int((ancestorIndex(1) - 21) / 3) * 750m

# ============================================================
# UE radio association
#
# Simu5G selects the strongest serving gNB at initialization.
# UEs are stationary during the first controlled experiments.
# ============================================================
*.ue[*].macCellId = 0
*.ue[*].masterId = 0
*.ue[*].nrMacCellId = 1
*.ue[*].nrMasterId = 1

**.dynamicCellAssociation = true
**.enableHandover = false

*.ue[*].mobility.typename = "StationaryMobility"

# ============================================================
# Three UEs around each macro gNB
#
# UE 0..62 correspond to macro gNBs 0..20.
# ============================================================
*.ue[0..62].mobility.initialX = 400m + (int(ancestorIndex(1) / 3) % 5) * 500m + ((ancestorIndex(1) % 3) - 1) * 35m
*.ue[0..62].mobility.initialY = 400m + int(int(ancestorIndex(1) / 3) / 5) * 500m + ((ancestorIndex(1) % 3) - 1) * 20m

# ============================================================
# Three UEs around each small cell
#
# UE 63..89 correspond to small-cell gNBs 21..29.
# ============================================================
*.ue[63..89].mobility.initialX = 650m + (int((ancestorIndex(1) - 63) / 3) % 3) * 750m + ((ancestorIndex(1) % 3) - 1) * 25m
*.ue[63..89].mobility.initialY = 650m + int(int((ancestorIndex(1) - 63) / 3) / 3) * 750m + ((ancestorIndex(1) % 3) - 1) * 15m

# ============================================================
# Downlink traffic receivers
# ============================================================
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 3000

# Six traffic periods for every UE:
#
#   0-12.5 s      = 00:00-05:00, low night traffic
#   12.5-25 s     = 05:00-10:00, morning office peak
#   25-40 s       = 10:00-16:00, medium daytime traffic
#   40-47.5 s     = 16:00-19:00, afternoon transition
#   47.5-56.25 s  = 19:00-22:30, IPL/evening peak
#   56.25-60 s    = 22:30-24:00, declining night traffic
#
# One simulation second represents 24 logical minutes.
*.server.numApps = 540

*.server.app[*].typename = "CbrSender"
*.server.app[*].packetSize = 1500B
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0) % 90) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 4000 + ancestorIndex(0)

# Low night load: 0.02 Mbps per UE
*.server.app[0..89].samplingTime = 0.60s
*.server.app[0..89].startTime = uniform(0.1s, 0.3s)
*.server.app[0..89].finishTime = 12.5s

# Morning office peak: 1 Mbps per UE
*.server.app[90..179].samplingTime = 0.012s
*.server.app[90..179].startTime = uniform(12.5s, 12.7s)
*.server.app[90..179].finishTime = 25s

# Medium daytime load: 0.2 Mbps per UE
*.server.app[180..269].samplingTime = 0.060s
*.server.app[180..269].startTime = uniform(25s, 25.2s)
*.server.app[180..269].finishTime = 40s

# Afternoon transition: 0.1 Mbps per UE
*.server.app[270..359].samplingTime = 0.120s
*.server.app[270..359].startTime = uniform(40s, 40.2s)
*.server.app[270..359].finishTime = 47.5s

# IPL/evening event peak: 3 Mbps per UE
*.server.app[360..449].samplingTime = 0.004s
*.server.app[360..449].startTime = uniform(47.5s, 47.7s)
*.server.app[360..449].finishTime = 56.25s

# Late-night decline: 0.03 Mbps per UE
*.server.app[450..539].samplingTime = 0.40s
*.server.app[450..539].startTime = uniform(56.25s, 56.45s)
*.server.app[450..539].finishTime = 59.8s

# ============================================================
# Auto EA-SORAN ZMQ interfaces
# ============================================================
*.shim.repBind = "tcp://*:6000"
*.shim.statusPubBind = "tcp://*:5557"
*.shim.echoToLog = true

*.metrics.pubBind = "tcp://127.0.0.1:5556"
*.metrics.publishInterval = 1
*.metrics.numGnbs = 30
*.metrics.twinId = "simu5g-nr-blr-30gnb-90ue"
*.metrics.echoToLog = false