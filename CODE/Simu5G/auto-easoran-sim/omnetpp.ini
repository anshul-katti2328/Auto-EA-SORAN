[General]
network = autoeasoran.zmqonly.AutoEASORANNetwork
sim-time-limit = 10min
description = "Pure ZMQ twin: 7 gNB explicit modules, metrics PUB (5556), orchestration REP (6000), status PUB (5557)."

# Qtenv for demo visuals
record-eventlog = false
**.vector-recording = false
**.scalar-recording = false

# Orchestration/metrics ports
*.shim.repBind = "tcp://127.0.0.1:6000"
*.shim.statusPubBind = "tcp://127.0.0.1:5557"
*.shim.echoToLog = true

*.metrics.pubBind = "tcp://127.0.0.1:5556"
*.metrics.publishInterval = 10
*.metrics.numGnbs = 7
*.metrics.twinId = "simu5g-twin"
*.metrics.echoToLog = false